<!doctype html>
<!-- The Set Hotkey window: shows the current combo, and hotkey.js records the next one pressed. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <title>Set Hotkey</title>
  <link rel="stylesheet" href="hotkey.css">
</head>
<body>
  <p id="combo"></p>
  <p id="message" role="status"></p>
  <button id="use-default" type="button">Use Default</button>
  <script src="hotkey-format.js"></script>
  <script src="hotkey.js"></script>
</body>
</html>
