<!doctype html>
<!-- Smoke Break's only page: a desktop canvas (the live screen seen from across the room) under a transparent overlay.
     scene.js runs the break and draws the desktop; smoker.js runs the cigarette, drawing the footage (footage.js) and smoke (smoke.js); audio.js plays the sound, background.js the optional landscape, and pointer.js shows the cursor while the mouse moves. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <title>Smoke Break</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="desktop"></canvas>
  <canvas id="overlay"></canvas>
  <script src="live-desktop.js"></script>
  <script src="footage-track.js"></script>
  <script src="footage.js"></script>
  <script src="ash-fall.js"></script>
  <script src="takedown-track.js"></script>
  <script src="takedown.js"></script>
  <script src="smoke.js"></script>
  <script src="background.js"></script>
  <script src="audio.js"></script>
  <script src="smoker.js"></script>
  <script src="scene.js"></script>
  <script src="pointer.js"></script>
</body>
</html>
